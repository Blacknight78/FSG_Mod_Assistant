<!DOCTYPE html>
<html>
<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
	<link rel="stylesheet" href="inc/bootstrap.min.css">
	<link rel="stylesheet" href="inc/fsico.css">
	<script src="inc/bootstrap.bundle.min.js"></script>
	
	<script src="renderJS/util/util_lib.js"></script>
	<script src="renderJS/debug_ui.js"></script>
	<style>
		::-webkit-scrollbar-track-piece:start { margin-top: 0px; }
		::-webkit-scrollbar {
			width: 10px;
			height: 10px;
		}
		.debug_log_item { white-space: pre; user-select: text; }
	</style>
</head>
<body data-bs-theme="dark" class="overflow-hidden">
	<div class="container-fluid px-0 user-select-none d-flex vh-100 flex-column">
		<div class="row bg-body border-bottom">
			<div class="col-12" style="-webkit-app-region: drag;">
				<i18n-text class="h2 ps-2 mastHead" data-key="app_name"></i18n-text>
			</div>
			<div class="col-12 px-2">
				<div class="btn-group btn-group-sm w-100 mt-2" role="group" aria-label="Debug view">
					<input type="radio" class="btn-check debug_view" name="debug_view" id="debug_view_log" value="log" checked>
					<label class="btn btn-outline-info border" for="debug_view_log">Log</label>
					<input type="radio" class="btn-check debug_view" name="debug_view" id="debug_view_performance" value="performance">
					<label class="btn btn-outline-info border" for="debug_view_performance">Performance</label>
				</div>
			</div>
			<div class="col-12 debug-toolbar-log">
				<div class="input-group input-group-sm btn-group w-100 mt-2 mb-2 px-1">
					<span class="input-group-text" id="basic-addon1">Show: </span>
					<button type="button" class="btn btn-outline-light border" id="debug_reset">RESET</button>
					<input type="checkbox" class="btn-check filter_only" id="debug_debug">
					<label data-bs-toggle="tooltip" title="Developer Stuff" class="btn btn-outline-success btn-sm border" for="debug_debug">DEBUG</label>
					<input type="checkbox" checked class="btn-check filter_only" id="debug_info">
					<label data-bs-toggle="tooltip" title="Information" class="btn btn-outline-success btn-sm border" for="debug_info">INFO</label>
					<input type="checkbox" checked class="btn-check filter_only" id="debug_notice">
					<label data-bs-toggle="tooltip" title="Subtle Warnings" class="btn btn-outline-success btn-sm border" for="debug_notice">NOTICE</label>
					<input type="checkbox" checked class="btn-check filter_only" id="debug_warning">
					<label data-bs-toggle="tooltip" title="Strong Warnings" class="btn btn-outline-success btn-sm border" for="debug_warning">WARNING</label>
					<input type="checkbox" checked class="btn-check filter_only" id="debug_danger">
					<label data-bs-toggle="tooltip" title="Failures" class="btn btn-outline-success btn-sm border" for="debug_danger">DANGER</label>
				</div>
			</div>
		</div>
		<div class="d-flex h-100 overflow-auto debug-panel" id="debugPanelLog">
			<div class="d-flex flex-column font-monospace small ms-2" id="debug_log"></div>
		</div>
		<div class="h-100 overflow-auto debug-panel d-none" id="debugPanelPerformance">
			<div class="container-fluid px-3 py-3">
				<div class="row gx-3 gy-3">
					<div class="col-sm-6 col-xl">
						<div class="border rounded p-3 h-100">
							<div class="small text-body-secondary">Main window visible</div>
							<div class="fs-5" id="performanceMainVisible">--</div>
						</div>
					</div>
					<div class="col-sm-6 col-xl">
						<div class="border rounded p-3 h-100">
							<div class="small text-body-secondary">Folder scan</div>
							<div class="fs-5" id="performanceFolderScan">--</div>
						</div>
					</div>
					<div class="col-sm-6 col-xl">
						<div class="border rounded p-3 h-100">
							<div class="small text-body-secondary">Renderer refresh</div>
							<div class="fs-5" id="performanceRendererUpdate">--</div>
						</div>
					</div>
					<div class="col-sm-6 col-xl">
						<div class="border rounded p-3 h-100">
							<div class="small text-body-secondary">Vault index</div>
							<div class="fs-5" id="performanceVaultIndex">--</div>
						</div>
					</div>
					<div class="col-sm-6 col-xl">
						<div class="border rounded p-3 h-100">
							<div class="small text-body-secondary">Vault copy</div>
							<div class="fs-5" id="performanceVaultCopy">--</div>
						</div>
					</div>
					<div class="col-sm-6 col-xl">
						<div class="border rounded p-3 h-100">
							<div class="small text-body-secondary">Vault preview</div>
							<div class="fs-5" id="performanceVaultCopyPreview">--</div>
						</div>
					</div>
					<div class="col-sm-6 col-xl">
						<div class="border rounded p-3 h-100">
							<div class="small text-body-secondary">Vault bulk copy</div>
							<div class="fs-5" id="performanceVaultBulkCopy">--</div>
						</div>
					</div>
					<div class="col-sm-6 col-xl">
						<div class="border rounded p-3 h-100">
							<div class="small text-body-secondary">ModHub refresh</div>
							<div class="fs-5" id="performanceModHubRefresh">--</div>
						</div>
					</div>
					<div class="col-12 small text-body-secondary user-select-text" id="performanceLogPath">Log file: --</div>
					<div class="col-md-6">
						<button class="btn btn-sm btn-outline-info w-100" id="performanceRefresh" type="button">Refresh performance summary</button>
					</div>
					<div class="col-md-6">
						<button class="btn btn-sm btn-outline-secondary w-100" id="performanceOpenLog" type="button">Open performance log</button>
					</div>
					<div class="col-12 small" id="performanceStatus" role="status"></div>
				</div>
			</div>
		</div>
		<!-- style="white-space: pre; user-select: text;" -->
	</div>

</body>
</html>
