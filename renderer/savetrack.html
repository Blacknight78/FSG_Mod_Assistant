<!DOCTYPE html>
<html>
<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
	<link rel="stylesheet" href="inc/bootstrap.min.css">
	<link rel="stylesheet" href="inc/src/bootstrap-icons.css">
	<link rel="stylesheet" href="inc/fsico.css">
	<link rel="stylesheet" href="inc/src/overrides.css">
	<script src="inc/bootstrap.bundle.min.js"></script>
	<script src="renderJS/util/util_lib.js"></script>
	<script src="renderJS/savertrack_ui.js"></script>
	<style>
		.utility-window {
			display: flex;
			flex-direction: column;
			gap: 0.75rem;
			height: 100vh;
			min-height: 0;
			padding: 0.75rem;
		}
		.utility-header {
			-webkit-app-region: drag;
			border-bottom: var(--bs-border-width) solid var(--bs-border-color);
			padding-bottom: 0.75rem;
		}
		.utility-header-grid {
			align-items: center;
			display: grid;
			gap: 1rem;
			grid-template-columns: minmax(18rem, 1fr) minmax(18rem, 42rem);
		}
		.utility-title-banner {
			background: color-mix(in srgb, var(--bs-primary) 70%, var(--bs-body-bg) 30%);
			border-radius: 0.5rem;
			color: #fff;
			font-weight: 700;
			margin: 0;
			padding: 0.45rem 1rem;
			text-align: center;
		}
		.utility-layout {
			display: grid;
			flex: 1 1 auto;
			gap: 0.75rem;
			grid-template-columns: 10rem minmax(0, 1fr);
			min-height: 0;
		}
		.utility-action-rail,
		.utility-content-panel {
			background: color-mix(in srgb, var(--bs-body-bg) 92%, var(--bs-secondary-bg) 8%);
			border: var(--bs-border-width) solid var(--bs-border-color);
			border-radius: 0.5rem;
			min-height: 0;
		}
		.utility-action-rail {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
			overflow: auto;
			padding: 0.5rem;
		}
		.utility-rail-button {
			align-items: center;
			display: flex;
			flex-direction: column;
			gap: 0.35rem;
			justify-content: center;
			line-height: 1.15;
			min-height: 4.8rem;
			padding: 0.5rem 0.35rem;
			text-align: center;
			white-space: normal;
		}
		.utility-content-panel {
			overflow: auto;
			padding: 1rem;
		}
		.utility-info-card {
			background: #111315;
			border: var(--bs-border-width) solid #30363d;
			border-radius: 0.5rem;
			padding: 0.9rem 1rem;
		}
		@media (max-width: 1000px) {
			.utility-layout,
			.utility-header-grid {
				grid-template-columns: 1fr;
			}
			.utility-action-rail {
				flex-direction: row;
			}
		}
	</style>
</head>
<body data-bs-theme="dark" class="overflow-hidden" id="drag_target">
	<div class="utility-window user-select-none">
		<header class="utility-header">
			<div class="utility-header-grid">
				<div class="app-window-brand">
					<span class="app-window-logo" aria-hidden="true"></span>
					<h1 class="app-window-name">FSG Mod Assistant</h1>
				</div>
				<i18n-text class="utility-title-banner h2" data-key="save_track_title"></i18n-text>
			</div>
		</header>
		<main class="utility-layout">
			<aside class="utility-action-rail" aria-label="Window actions">
				<button type="button" class="btn btn-primary utility-rail-button" id="openFolderButton">
					<i class="bi bi-folder2-open" aria-hidden="true"></i>
					<i18n-text data-key="open_save_folder"></i18n-text>
				</button>
				<button type="button" class="btn btn-outline-light utility-rail-button" data-ma-dispatch-window="mod_management">
					<i class="bi bi-arrow-left" aria-hidden="true"></i>
					<span>Back</span>
				</button>
			</aside>
			<section class="utility-content-panel">
				<i18n-text class="utility-info-card text-center mb-3 w-100 d-block fs-5" data-key="save_track_blurb"></i18n-text>
				<div class="mx-2 my-3 text-center fs-5" id="no_list_yet"><i18n-text data-key="save_track_none"></i18n-text></div>
				<div class="mx-2 my-3 row gy-4" id="modList"></div>
			</section>
		</main>

	</div>




<template id="savetrack_current">
	<div class="col-12 inset-block"><div>
		<span class="inset-block-header"><i18n-text data-key="save_track_current"></i18n-text> <em class="small">(<template-var>savegameID</template-var>)</em></span>
		<template-var class="row row-cols-3 g-2">modList</template-var>
	</div></div>
</template>

<template id="savetrack_backup">
	<div class="col-12 inset-block"><div>
		<span class="inset-block-header"><i18n-text data-key="save_track_backup"></i18n-text>: <em><template-var>backupDate</template-var></em></span>
		<i18n-text class="h6 is_duplicate text-body-emphasis fst-italic" data-key="save_track_duplicate"></i18n-text>
		<div class="is_not_duplicate">
			<i18n-text class="h6 text-primary-subtle" data-key="save_track_only_current"></i18n-text>
			<template-var class="row row-cols-3 g-2 mb-4">onlyCurrent</template-var>
			<i18n-text class="h6 text-primary-subtle" data-key="save_track_only_backup"></i18n-text>
			<template-var class="row row-cols-3 g-2">onlyBackup</template-var>
		</div>
	</div></div>
</template>

</body>
</html>
