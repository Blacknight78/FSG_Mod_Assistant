<html>
<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
	<link rel="stylesheet" href="inc/bootstrap.min.css">
	<link rel="stylesheet" href="inc/src/bootstrap-icons.css">
	<link rel="stylesheet" href="inc/fsico.css">
	<link rel="stylesheet" href="inc/src/overrides.css">
	<script src="inc/bootstrap.bundle.min.js"></script>
	<script src="renderJS/util/util_lib.js"></script>
	<script src="renderJS/savemanage_ui.js"></script>
	<style>
		.farm_01 { color : #ffaf00; }
		.farm_02 { color : #ff6201; }
		.farm_03 { color : #db277e; }
		.farm_04 { color : #8a13bd; }
		.farm_05 { color : #7958ef; }
		.farm_06 { color : #638aff; }
		.farm_07 { color : #63f6ff; }
		.farm_08 { color : #84ff82; }
		.table-sm>:not(caption)>*>* {
			padding: .15rem .25rem;
		}
		.utility-window {
			display: flex;
			flex-direction: column;
			gap: 0.75rem;
			height: 100vh;
			min-height: 0;
			padding: 0.75rem;
		}
		.utility-header {
			-webkit-app-region: drag;
			border-bottom: var(--bs-border-width) solid var(--bs-border-color);
			padding-bottom: 0.75rem;
		}
		.utility-header-grid {
			align-items: center;
			display: grid;
			gap: 1rem;
			grid-template-columns: minmax(18rem, 1fr) minmax(18rem, 42rem);
		}
		.utility-title-banner {
			background: color-mix(in srgb, var(--bs-primary) 70%, var(--bs-body-bg) 30%);
			border-radius: 0.5rem;
			color: #fff;
			font-weight: 700;
			margin: 0;
			padding: 0.45rem 1rem;
			text-align: center;
		}
		.utility-layout {
			display: grid;
			flex: 1 1 auto;
			gap: 0.75rem;
			grid-template-columns: 10rem minmax(0, 1fr);
			min-height: 0;
		}
		.utility-action-rail,
		.utility-content-panel {
			background: color-mix(in srgb, var(--bs-body-bg) 92%, var(--bs-secondary-bg) 8%);
			border: var(--bs-border-width) solid var(--bs-border-color);
			border-radius: 0.5rem;
			min-height: 0;
		}
		.utility-action-rail {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
			overflow: auto;
			padding: 0.5rem;
		}
		.utility-rail-button {
			align-items: center;
			display: flex;
			flex-direction: column;
			gap: 0.35rem;
			justify-content: center;
			line-height: 1.15;
			min-height: 4.8rem;
			padding: 0.5rem 0.35rem;
			text-align: center;
			white-space: normal;
		}
		.utility-content-panel {
			overflow: auto;
			padding: 1rem;
		}
		.utility-info-card {
			background: #111315;
			border: var(--bs-border-width) solid #30363d;
			border-radius: 0.5rem;
			padding: 0.9rem 1rem;
		}
		@media (max-width: 1000px) {
			.utility-layout,
			.utility-header-grid {
				grid-template-columns: 1fr;
			}
			.utility-action-rail {
				flex-direction: row;
			}
		}
	</style>
</head>
<body data-bs-theme="dark" class="overflow-hidden" id="drag_target">
	<div class="utility-window user-select-none">
		<header class="utility-header">
			<div class="utility-header-grid">
				<div class="app-window-brand">
					<span class="app-window-logo" aria-hidden="true"></span>
					<h1 class="app-window-name">FSG Mod Assistant</h1>
				</div>
				<i18n-text class="utility-title-banner h2" data-key="save_manage_title"></i18n-text>
			</div>
		</header>
		<main class="utility-layout">
			<aside class="utility-action-rail" aria-label="Window actions">
				<button type="button" class="btn btn-primary utility-rail-button" id="importButton">
					<i class="bi bi-file-earmark-zip" aria-hidden="true"></i>
					<i18n-text data-key="save_manage_import"></i18n-text>
				</button>
				<button type="button" class="btn btn-outline-light utility-rail-button" data-ma-dispatch-window="mod_management">
					<i class="bi bi-arrow-left" aria-hidden="true"></i>
					<span>Back</span>
				</button>
			</aside>
			<section class="utility-content-panel">
				<i18n-text class="utility-info-card text-center mb-3 w-100 d-block fs-5" data-key="save_manage_blurb"></i18n-text>
				<ul class="nav nav-tabs" id="savemanageTab" role="tablist">
					<li class="nav-item" role="presentation">
						<i18n-text class="nav-link active" id="active-tab" data-bs-target="#active-tab-pane" data-bs-toggle="tab" data-key="save_manage_active"></i18n-text>
					</li>
					<li class="nav-item" role="presentation">
						<i18n-text class="nav-link" id="backup-tab" data-bs-target="#backup-tab-pane" data-bs-toggle="tab" data-key="save_manage_backup"></i18n-text>
					</li>			
				</ul>
				<div class="tab-content" id="savemanageTabContent">
					<div class="tab-pane fade show active py-4" id="active-tab-pane" role="tabpanel">
						<div id="active_games" class="row gy-4"></div>
					</div>
					<div class="tab-pane fade show py-4" id="backup-tab-pane" role="tabpanel">
						<div id="backup_games" class="row gy-4"></div>
					</div>
				</div>
			</section>
		</main>
	</div>

	<div class="modal" id="collect_savegame_modal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-body">
					<p class="m-0"><i18n-text data-key="save_manage_select_collection"></i18n-text></p>
					<ul class="m-0 py-2">
						<li><strong><i18n-text data-key="save_manage_name"></i18n-text>:</strong> <span id="save_collect_name"></span></li>
						<li><strong><i18n-text data-key="save_manage_path"></i18n-text>:</strong> <span id="save_collect_path"></span></li>
					</ul>
					<div class="row">
						<div class="col-auto">
							<label for="save_collect_choice" class="col-form-label"><i18n-text data-key="save_manage_collection"></i18n-text></label>
						</div>
						<div class="col">
							<select id="save_collect_choice" class="form-select" aria-label="Default select example">
							</select>
						</div>
					</div>
				</div>
				<div class="modal-footer">
					<div class="row w-100">
						<div class="col-3">
							<img src="img/info_ask.webp" alt="" class="w-100">
						</div>
						<div class="col-9">
							<i18n-text type="button" class="w-100 mb-2 btn btn-warning" data-bs-dismiss="modal" data-key="save_manage_button_cancel"></i18n-text>
							<i18n-text type="button" class="w-100 btn btn-success" id="compare_save_btn" data-key="save_manage_button_ok"></i18n-text>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal" id="delete_savegame_modal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-body">
					<p class="m-0"><i18n-text data-key="save_manage_confirm_delete"></i18n-text></p>
					<ul class="m-0 py-2">
						<li><strong><i18n-text data-key="save_manage_name"></i18n-text>:</strong> <span id="save_delete_name"></span></li>
						<li><strong><i18n-text data-key="save_manage_path"></i18n-text>:</strong> <span id="save_delete_path"></span></li>
					</ul>
				</div>
				<div class="modal-footer">
					<div class="row w-100">
						<div class="col-3">
							<img alt="" src="img/info_warn.webp" class="w-100">
						</div>
						<div class="col-9">
							<i18n-text type="button" class="w-100 mb-2 btn btn-danger text-white" data-bs-dismiss="modal" data-key="save_manage_button_cancel"></i18n-text>
							<i18n-text type="button" class="w-100 btn btn-success" id="delete_save_btn" data-key="save_manage_button_ok"></i18n-text>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal" id="restore_savegame_modal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-body">
					<p class="m-0"><i18n-text data-key="save_manage_select_restore"></i18n-text></p>
					<ul class="m-0 py-2">
						<li><strong><i18n-text data-key="save_manage_name"></i18n-text>:</strong> <span id="save_restore_name"></span></li>
						<li><strong><i18n-text data-key="save_manage_path"></i18n-text>:</strong> <span id="save_restore_path"></span></li>
					</ul>
					<div class="row">
						<div class="col-auto">
							<label for="save_restore_choice" class="col-form-label"><i18n-text data-key="save_restore_slot"></i18n-text></label>
						</div>
						<div class="col">
							<select id="save_restore_choice" class="form-select" aria-label="Default select example">

								<option value="20">20</option>
							</select>
						</div>
					</div>
				</div>
				<div class="modal-footer">
					<div class="row w-100">
						<div class="col-3">
							<img alt="" src="img/info_warn.webp" class="w-100">
						</div>
						<div class="col-9">
							<i18n-text type="button" class="w-100 mb-2 btn btn-danger text-white" data-bs-dismiss="modal" data-key="save_manage_button_cancel"></i18n-text>
							<i18n-text type="button" class="w-100 btn btn-success" id="restore_save_btn" data-key="save_manage_button_ok"></i18n-text>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal" id="import_savegame_modal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-body">
					<p class="m-0 mb-3"><i18n-text data-key="save_manage_select_import"></i18n-text></p>
					<ul class="m-0 py-2">
						<li><strong><i18n-text data-key="save_manage_path"></i18n-text>:</strong> <span id="save_import_path"></span></li>
					</ul>
					<div class="mb-3">
						<i18n-text type="button" class="w-100 mb-2 btn btn-warning text-white" id="import_save_load_btn" data-key="save_manage_button_import"></i18n-text>
					</div>
					<div class="row">
						<div class="col-auto">
							<label for="save_import_choice" class="col-form-label"><i18n-text data-key="save_import_slot"></i18n-text></label>
						</div>
						<div class="col">
							<select id="save_import_choice" class="form-select" aria-label="Default select example">
								<option selected>--</option>
								<option value="1">1</option>

								<option value="20">20</option>
							</select>
						</div>
					</div>
				</div>
				<div class="modal-footer">
					<div class="row w-100">
						<div class="col-3">
							<img alt="" src="img/info_ask.webp" class="w-100">
						</div>
						<div class="col-9">
							<i18n-text type="button" class="w-100 mb-2 btn btn-danger text-white" data-bs-dismiss="modal" data-key="save_manage_button_cancel"></i18n-text>

			</div>
		</div>
	</div>




<template id="savegame_record">
	<div class="col-12 inset-block"><div>
		<span class="inset-block-header"><template-var>saveNumber</template-var> :: <template-var>saveName</template-var></span>
		<div class="row gx-2">
			<div class="col-5"><table class="table table-sm table-borderless table-striped">
				<tr><td><i18n-text class="fst-italic" data-key="save_manage_time"></i18n-text></td><td><template-var>savePlayTime</template-var></td></tr>
				<tr><td><i18n-text class="fst-italic" data-key="save_manage_date"></i18n-text></td><td><template-var>saveDate</template-var></td></tr>
				<tr><td><i18n-text class="fst-italic" data-key="save_manage_real_date"></i18n-text></td><td><template-var>saveRealDate</template-var></td></tr>
				<tr><td><i18n-text class="fst-italic" data-key="save_manage_mods"></i18n-text></td><td><template-var>saveModCount</template-var></td></tr>
				<tr><td><i18n-text class="fst-italic" data-key="save_manage_map"></i18n-text></td><td><template-var>saveMap</template-var></td></tr>
			</table></div>
			<div class="col-4"><template-var>farms</template-var></div>
			<div class="col-3 text-center buttonDiv"></div>
		</div>
	</div></div>
</template>


<template id="savegame_active_buttons">
	<div class="d-flex flex-column justify-content-around h-100">
		<i18n-text type="button" class="align-content-around do-compare-save-btn flex-grow-1 border-dark btn btn-sm btn-primary" data-key="save_manage_compare"></i18n-text>
		<i18n-text type="button" class="align-content-around do-export-save-btn flex-grow-1 border-dark btn btn-sm btn-primary" data-key="save_manage_export"></i18n-text>
		<i18n-text type="button" class="align-content-around do-restore-save-btn flex-grow-1 border-dark btn btn-sm btn-warning" data-key="save_manage_duplicate"></i18n-text>
		<i18n-text type="button" class="align-content-around do-delete-save-btn flex-grow-1 border-dark btn btn-sm btn-danger text-white" data-key="save_manage_delete"></i18n-text>
	</div>
</template>

<template id="savegame_backup_buttons">
	<div class="d-flex flex-column justify-content-around h-100">
		<i18n-text type="button" class="align-content-around do-compare-save-btn flex-grow-1 border-dark btn btn-sm btn-primary" data-key="save_manage_compare"></i18n-text>
		<i18n-text type="button" class="align-content-around do-export-save-btn flex-grow-1 border-dark btn btn-sm btn-primary" data-key="save_manage_export"></i18n-text>
		<i18n-text type="button" class="align-content-around do-restore-save-btn flex-grow-1 border-dark btn btn-sm btn-warning" data-key="save_manage_restore"></i18n-text>
		<i18n-text type="button" class="align-content-around do-delete-save-btn flex-grow-1 border-dark btn btn-sm btn-danger text-white" data-key="save_manage_delete"></i18n-text>
	</div>
</template>

</body>
</html>
